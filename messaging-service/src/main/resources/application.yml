server:
  port: 8092

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}

security:
  jwt:
    secret: ${KEYSECRET_SECURITY}   # <- Variable de entorno
    issuer: "zoologico-service"
    audience: "messaging-service"

sqs:
  excel-queue-url: ${EXCEL_QUEUE_URL}
  excel-dlq-url: ${EXCEL_DLQ_URL}
  pdf-queue-url: ${PDF_QUEUE_URL}
  pdf-dlq-url: ${PDF_DLQ_URL}

s3:
  bucket-name: ${S3_BUCKET_NAME}

appDescription: "Messaging-Service"
appVersion: "1.0.0"
