AWSTemplateFormatVersion: "2010-09-09"
Description: >
  RDS PostgreSQL instance for gestion-zoologico — development / free-tier.
  Deploys a Security Group restricted to a single trusted IP and a db.t3.micro
  PostgreSQL instance with 20 GB of gp2 storage.

# ──────────────────────────────────────────────────────────────────────────────
# Parameters
# ──────────────────────────────────────────────────────────────────────────────
Parameters:

  DBMasterUsername:
    Type: String
    Description: Administrator username for the RDS instance.
    MinLength: 1
    MaxLength: 16
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"
    ConstraintDescription: Must start with a letter and contain only alphanumeric characters or underscores.

  DBMasterPassword:
    Type: String
    Description: Administrator password for the RDS instance (8–41 characters).
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    AllowedPattern: "[a-zA-Z0-9!@#$%^&*()_+=-]*"
    ConstraintDescription: Must be 8–41 characters; letters, digits and common special chars only.

  DBName:
    Type: String
    Default: zoologicodb
    Description: Initial database name created inside the instance.
    MinLength: 1
    MaxLength: 64
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"

  TrustedCIDR:
    Type: String
    Description: >
      Your public IP address in CIDR notation (e.g. 203.0.113.42/32).
      Only this address will be allowed to reach PostgreSQL on port 5432.
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    ConstraintDescription: Must be a valid CIDR block (e.g. 203.0.113.42/32).

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID of the VPC where the Security Group will be created.

  DBSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      At least two subnets in different Availability Zones for the DB Subnet Group.
      For a dev setup these can be public subnets; for production use private subnets.

# ──────────────────────────────────────────────────────────────────────────────
# Resources
# ──────────────────────────────────────────────────────────────────────────────
Resources:

  # ── 1. Security Group ───────────────────────────────────────────────────────
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL access only from the trusted IP address.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref TrustedCIDR
          Description: PostgreSQL from trusted developer IP
      SecurityGroupEgress:
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic (required for patch downloads, etc.)
      Tags:
        - Key: Name
          Value: rds-zoologico-sg
        - Key: Project
          Value: gestion-zoologico
        - Key: Environment
          Value: development

  # ── 2. DB Subnet Group ──────────────────────────────────────────────────────
  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for gestion-zoologico RDS instance.
      SubnetIds: !Ref DBSubnetIds
      Tags:
        - Key: Name
          Value: rds-zoologico-subnet-group
        - Key: Project
          Value: gestion-zoologico

  # ── 3. RDS PostgreSQL Instance ──────────────────────────────────────────────
  RDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot   # take a final snapshot before stack deletion
    Properties:
      DBInstanceIdentifier: zoologico-db-dev
      DBName: !Ref DBName
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: db.t3.micro          # lowest-cost class; Free Tier eligible
      AllocatedStorage: "20"                # GB — Free Tier allows up to 20 GB
      StorageType: gp2
      StorageEncrypted: false               # encryption not available on Free Tier t3.micro
      MasterUsername: !Ref DBMasterUsername
      MasterUserPassword: !Ref DBMasterPassword
      PubliclyAccessible: true              # needed to connect from a developer machine
      MultiAZ: false                        # Multi-AZ doubles cost; disable for dev
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 7              # 7 days — Free Tier includes backup storage equal to DB size
      PreferredBackupWindow: "03:00-04:00"
      PreferredMaintenanceWindow: "sun:04:00-sun:05:00"
      DeletionProtection: false             # set to true in production
      DBSubnetGroupName: !Ref RDSSubnetGroup
      VPCSecurityGroups:
        - !GetAtt RDSSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: zoologico-db-dev
        - Key: Project
          Value: gestion-zoologico
        - Key: Environment
          Value: development

# ──────────────────────────────────────────────────────────────────────────────
# Outputs
# ──────────────────────────────────────────────────────────────────────────────
Outputs:

  DBEndpoint:
    Description: Connection endpoint (hostname) for the RDS PostgreSQL instance.
    Value: !GetAtt RDSInstance.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-DBEndpoint"

  DBPort:
    Description: Port on which PostgreSQL is listening.
    Value: !GetAtt RDSInstance.Endpoint.Port
    Export:
      Name: !Sub "${AWS::StackName}-DBPort"

  DBInstanceId:
    Description: RDS DB Instance identifier.
    Value: !Ref RDSInstance
    Export:
      Name: !Sub "${AWS::StackName}-DBInstanceId"

  DBName:
    Description: Name of the initial database created inside the instance.
    Value: !Ref DBName
    Export:
      Name: !Sub "${AWS::StackName}-DBName"

  SecurityGroupId:
    Description: ID of the Security Group attached to the RDS instance.
    Value: !GetAtt RDSSecurityGroup.GroupId
    Export:
      Name: !Sub "${AWS::StackName}-SGId"
