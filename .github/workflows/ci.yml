name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, master]

jobs:
  build-zoologico:
    name: Build & Test zoologico-service
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build y test
        run: chmod +x ./gradlew && ./gradlew :zoologico-service:build

      - name: Gate JaCoCo (mínimo 92 %)
        run: ./gradlew :zoologico-service:jacocoTestCoverageVerification

  build-messaging:
    name: Build & Test messaging-service
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build y test
        run: chmod +x ./gradlew && ./gradlew :messaging-service:build
